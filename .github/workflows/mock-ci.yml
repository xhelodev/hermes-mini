name: mock-ci

on:
  push:
    paths:
      - 'mock/**'
      - '.github/workflows/mock-ci.yml'
  pull_request:
    paths:
      - 'mock/**'
      - '.github/workflows/mock-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mock/package.json
      - run: npm install
      - run: npm test
